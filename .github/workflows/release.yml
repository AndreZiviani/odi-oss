name: release

# Pushing a vX.Y.Z tag builds the full flashable image -- kernel, packages,
# our own tools, confd and metricsd from their own public releases -- with
# ROOT_PW=locked (docs/BUILDING.md): a public release image ships keys-only,
# never a per-build password baked into a squashfs anyone can unpack. The
# result is published as a GitHub release: the tarball, its SHA256SUMS, an
# SBOM (tools/generate-sbom.sh, checked by tools/verify-sbom.sh), the
# corresponding-source bundle (tools/bundle-sources.sh, docs/LICENSING.md),
# release notes built from CHANGELOG.md by tools/release-notes.sh, and a
# build-provenance + SBOM attestation for the tarball, its sources, its checksums and the SBOM itself -- see docs/FLASHING.md,
# "Verifying a release", for how to check them.
#
# A tag with a hyphen after the version (v1.2.2-beta.1) is a test build: it
# is published as a GitHub pre-release, never marked latest, with the
# `## Unreleased` changelog section as its notes (tools/release-notes.sh).
#
# Publication is gated, in order, on:
#   1. `gate`: the tag commit is an ancestor of origin/main
#      (tools/check-release-ancestry.sh). Final tags only: a pre-release tag
#      (v1.2.2-beta.1) is how unmerged work is tested together and may be on
#      an integration branch, so it skips this check, and still needs 2.
#   2. `ci`: ci.yml, called as a reusable workflow on that same commit: lint,
#      the host-side tests, diag, every OMCI suite, test-qemu, the rcS trace
#      goldens, the clean-build check, `full` and the `reproducible` two-build
#      comparison. The release job needs it, so one failed, cancelled or
#      still-running job there means nothing is published. ci.yml no longer
#      starts on `v*` tags itself: calling it here runs it once per tag
#      instead of twice, and makes the wait a plain `needs`.
#   3. only then does `release` build the image and publish it.
#
# workflow_dispatch is a dry run: it runs 1 and 2 on the chosen ref and never
# reaches the release job, so the gate can be exercised without a tag.
#
# This is the one workflow here that actually builds the kernel and the
# image (ci.yml deliberately does not: about an hour of compiling a runner
# would spend on every push). Expect this job to take several minutes.
#
# concurrency: a tag push has landed here twice for the same ref before
# (the tag itself pushed, then the branch it was cut from merged a moment
# later under the same name) -- two runs racing on the same VERSION, the
# second one failing outright at "gh release create" because the release
# the first run made already exists. The group serialises them instead of
# cancelling either (a half-finished release build is worse than a slow
# second one), and the publish step below is idempotent on top of that, so
# a rerun -- whatever triggers it -- can never fail this way again.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Read-only by default; only the release job, which publishes and attests,
# raises its own scope. The tests job runs repository code and gets none of it.
permissions:
  contents: read

jobs:
  # The first thing that runs, so a tag on a commit main does not contain
  # costs seconds, not an hour of CI. The full history is fetched by the
  # script itself, with a bound.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The release commit is on origin/main
        run: tools/check-release-ancestry.sh "$GITHUB_SHA" main "$GITHUB_REF_NAME"

  # Every release-grade check of ci.yml, for this exact commit. Job timeouts
  # are the ones set inside ci.yml; the longest (reproducible) is 90 minutes.
  ci:
    needs: gate
    uses: ./.github/workflows/ci.yml

  release:
    needs: [gate, ci]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # gh release create/edit/upload
      id-token: write # keyless signing for the attestations
      attestations: write # store the attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Upstream tarballs (busybox, dropbear, iproute2, the Linux tree and its
      # signature) and the confd/metricsd release assets land in dl/. The key
      # is the files that pin their versions and SHA-256s, so a bump misses the
      # cache and fetches anew. A hit only skips the download: every fetch
      # script still re-checks the pinned SHA-256 of the file it finds there.
      - name: Cache pinned downloads (dl/)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            dl
          key: dl-release-${{ runner.os }}-${{ hashFiles('packages/fetch.sh', 'packages/*/build.sh', 'kernel/618/fetch.sh', 'src/fetch-releases.sh', 'src/release-sha256.txt', 'tools/bundle-sources.sh', 'toolchain/images.env') }}

      - name: Version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Build the release image (keys-only root)
        run: VERSION="$VERSION" ROOT_PW=locked make image-all

      - name: Checksums
        working-directory: out/image
        run: sha256sum "$VERSION.tar" > SHA256SUMS

      - name: No password file made it into the release
        working-directory: out/image
        run: |
          if ls root-password*.txt >/dev/null 2>&1; then
            echo "release.yml: a root-password file exists for a ROOT_PW=locked build -- refusing to publish" >&2
            exit 1
          fi

      # The complete corresponding source of the image (GPL/LGPL): the same
      # verified tarballs make image-all used from dl/, uClibc-ng, confd and
      # metricsd at their tags and this tree, in one
      # asset. The script checks its own result and fails the job if it is missing,
      # empty or does not match its own checksums; its sha256 joins
      # SHA256SUMS, so the attestation below covers it too.
      - name: Corresponding source bundle
        run: |
          tools/bundle-sources.sh "$VERSION" "out/image/$VERSION-sources.tar"
          (cd out/image && sha256sum "$VERSION-sources.tar" >> SHA256SUMS)

      # Reads the pins already in the tree (kernel/618/fetch.sh,
      # packages/*/build.sh, toolchain/images.env, src/release-sha256.txt) plus
      # the metricsd/confd tags make image-all actually fetched
      # (out/bin/releases.env), and hashes every file the image carries from
      # the build output: tools/sbom.py header has the detail. SBOM_STRICT
      # fails the job on a missing artifact rather than publish a SBOM with a
      # hole in it. The SBOM is checked (tools/verify-sbom.sh) before it is
      # published, and its sha256 joins SHA256SUMS, so the provenance
      # attestation below covers it as a subject of its own.
      - name: SBOM
        run: |
          SBOM_STRICT=1 SBOM_IMAGE="out/image/$VERSION.tar" \
            tools/generate-sbom.sh "$VERSION" out/bin/releases.env > out/image/sbom.cdx.json
          (cd out/image && sha256sum sbom.cdx.json >> SHA256SUMS)
          tools/verify-sbom.sh out/image/sbom.cdx.json --sums out/image/SHA256SUMS

      - name: Release notes
        run: tools/release-notes.sh "$VERSION" > /tmp/release-notes.md

      # Provenance for the image, the sources, the SBOM and the checksums:
      # signed, keyless, tied to this workflow run. gh attestation verify
      # checks them against the file bytes, so this has to run after the last
      # write to SHA256SUMS and before any file is renamed.
      - name: Attest build provenance (image tarball + checksums)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/image/${{ env.VERSION }}.tar
            out/image/${{ env.VERSION }}-sources.tar
            out/image/sbom.cdx.json
            out/image/SHA256SUMS

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: out/image/${{ env.VERSION }}.tar
          sbom-path: out/image/sbom.cdx.json

      # Idempotent: a rerun for a VERSION whose release already exists (the
      # concurrency group above is about ordering, not about preventing
      # this -- a manual workflow_dispatch retry or a second tag push still
      # lands here) edits the existing release and re-uploads its assets
      # with --clobber instead of failing on "already exists".
      - name: Publish the GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=(
            "out/image/$VERSION.tar"
            "out/image/$VERSION-sources.tar"
            out/image/SHA256SUMS
            out/image/sbom.cdx.json
          )
          [ -s "out/image/$VERSION-sources.tar" ] || {
            echo "release.yml: the sources asset is missing or empty -- refusing to publish" >&2
            exit 1
          }
          flags=()
          case "$VERSION" in
          *-*) flags=(--prerelease --latest=false) ;;
          esac
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release.yml: $VERSION already exists, updating notes and re-uploading assets" >&2
            gh release edit "$VERSION" --title "$VERSION" --notes-file /tmp/release-notes.md "${flags[@]}"
            gh release upload "$VERSION" "${assets[@]}" --clobber
          else
            gh release create "$VERSION" "${assets[@]}" \
              --title "$VERSION" \
              --notes-file /tmp/release-notes.md "${flags[@]}"
          fi
