name: ci

# Pull requests and pushes to main run the tests: lint, the host-side
# tests, diag with the exporter contract, and the OMCI daemon under qemu
# (which builds the binaries it runs). A release tag runs the full suite:
# the tests, then the build of every freestanding binary in src/ on its
# own. The toolchain, the kernel and the image are not built here: an hour
# of compiling and two kernel trees this runner would fetch from third
# parties, and nothing in them is exercised without a stick.
on:
  push:
    branches: [main]
    tags: ['v*', 'odi-oss-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint (shellcheck, inline-quote check)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          make lint

      - name: Host-side tests
        run: make test-host

      - name: diag, including the exporter contract under qemu
        run: make test-diag

      - name: OMCI daemon under qemu
        run: make test-omci

  full:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Our binaries (freestanding, in the diag toolchain container)
        run: make src
