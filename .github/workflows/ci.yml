name: ci

# Pull requests and pushes to main run the tests, as parallel jobs: lint, the host-side
# tests (plain, and again under ASan/UBSan), a bounded fuzz run of the OMCI
# daemon built for the host, diag with the exporter contract, and the OMCI daemon under qemu
# (which builds the binaries it runs), a clean-build check (fetch and
# verify the pinned kernel tree, build src, then confirm `make image` fails
# closed and names what it is missing -- nothing here is flashed or booted),
# and test-qemu (boots the real rootfs full-system on a STOCK kernel from
# odi-toolchain, never this repository's own -- docs/HACKING.md). A release
# tag runs the full suite: the tests, then the build of every freestanding
# binary in src/ on its own. This repository's own kernel and the full
# image are built only by the `reproducible` job, on tags and manual runs,
# never on a push or pull request: nothing in either is exercised without a
# stick.
#
# A `v*` tag does not trigger this workflow by itself: release.yml calls it
# (workflow_call) as the job its release job needs, so the whole suite, the
# full and reproducible jobs included, runs once per tag, on the tag commit,
# and publication waits for every job of it. The jobs that gate on
# `startsWith(github.ref, 'refs/tags/')` see the caller's ref, so they run
# in that call exactly as they would on a tag push.
on:
  push:
    branches: [main]
    tags: ['odi-oss-*']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      # release.yml sets it on a tag push: the reproducible job then keeps
      # the image it compared, and the build output its SBOM is made from,
      # as the artifact the release job publishes. A dry run leaves it off.
      keep-image:
        type: boolean
        default: false
    outputs:
      image-sha256:
        description: SHA-256 of the image tarball both reproducible builds produced
        value: ${{ jobs.reproducible.outputs.image-sha256 }}

permissions:
  contents: read

jobs:
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: PR touches CHANGELOG.md, or is docs/CI-only, or is labelled no-changelog
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          case ",$LABELS," in
            *,no-changelog,*)
              echo "changelog: no-changelog label set, skipping"
              exit 0
              ;;
          esac

          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          echo "$changed"

          non_exempt=$(echo "$changed" | grep -Ev '^(docs/|\.github/)' || true)
          if [ -z "$non_exempt" ]; then
            echo "changelog: docs-only or CI-only change, no CHANGELOG.md entry required"
            exit 0
          fi

          if ! echo "$changed" | grep -qx "CHANGELOG.md"; then
            echo "changelog: this PR changes files outside docs/CI but does not touch CHANGELOG.md" >&2
            echo "changelog: add an entry under \"## Unreleased\", or apply the no-changelog label" >&2
            exit 1
          fi

  # Four jobs side by side instead of one job running four steps: the
  # slowest of them, not their sum, is the wall time of a pull request.
  # shellcheck is on the runner image; the install is only a fallback.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pinned REUSE tool, installed with hash checking. pip gets a
      # timeout and retries, and the step a wall-clock limit, so a stalled
      # index cannot hold the job.
      - name: Install reuse (pinned, hash-checked)
        run: |
          python3 -m venv "$RUNNER_TEMP/reuse"
          timeout 300 "$RUNNER_TEMP/reuse/bin/pip" install --require-hashes \
            --retries 3 --timeout 30 -r tools/reuse-requirements.txt
          echo "$RUNNER_TEMP/reuse/bin" >> "$GITHUB_PATH"

      - name: Lint (shellcheck, inline-quote check, REUSE)
        env:
          ODI_REQUIRE_REUSE: "1"
        run: |
          command -v shellcheck >/dev/null || {
            tools/ci-apt.sh shellcheck
          }
          make lint

  # Static analysis of the C code. The runner image is named, not latest:
  # another cppcheck release reports other findings, and a new one should
  # arrive in a change of its own, not in an unrelated pull request.
  cppcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: cppcheck
        run: |
          tools/ci-apt.sh cppcheck
          cppcheck --version
          make cppcheck

  host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Host-side tests
        run: make test-host

  # The C unit tests of the host leg again, built with AddressSanitizer and
  # UndefinedBehaviorSanitizer (make test-host-asan). A separate job so the
  # plain leg stays the plain build. The runner has the sanitizer runtimes with
  # its gcc; no container, no cache needed: nothing is downloaded.
  host-asan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Host C tests under ASan and UBSan
        run: make test-host-asan

  # omcid built for the host and run under libFuzzer with AddressSanitizer
  # and UndefinedBehaviorSanitizer (make fuzz-omci, src/omci/fuzz/README.md):
  # four minutes, both targets side by side with two processes each (the
  # runner has four cores), and the job fails on anything found. The input
  # that broke omcid is printed as hex in the log, which is the form it is
  # added to the tree in, so no artifact is uploaded. The four minutes
  # include running the corpus once, which with a grown corpus is the first
  # two of them: one input is a whole life of the daemon.
  #
  # The corpus the fuzzer grows is kept in a cache, so a run starts where
  # the last one on main stopped and does not spend its time finding the
  # first frames again. Every run restores the newest; only a run on main
  # saves one, trimmed to the inputs that add coverage, after it passed. A
  # cache key is written once, so each save is under its own run id. A pull
  # request reads the cache of main and writes none. The cache holds fuzz
  # inputs only, and an input can do no more than fail the job that reads
  # it.
  #
  # The seeds and every input that once broke omcid are not this job: they
  # run in host and host-asan (make test-host), with cc, every time.
  #
  # Only on a pull request and on a push to main. What a fuzz run finds
  # depends on the run, so it is not part of what a release waits for:
  # not on a tag, and not when release.yml calls this workflow, which is
  # also how a release is rehearsed from a branch (the event is then that
  # of the caller, workflow_dispatch or the tag push). A finding belongs
  # to the pull request or the push to main that ran into it.
  fuzz-omci:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner has clang; its libFuzzer runtime is a package of its own
      # that the image does not always carry. Build a one-line fuzz target
      # to find out, and install the runtime of that clang only if it fails.
      - name: clang with the libFuzzer runtime
        run: |
          command -v clang >/dev/null || tools/ci-apt.sh clang
          probe="$RUNNER_TEMP/fuzz-probe"
          echo 'int LLVMFuzzerTestOneInput(const unsigned char *d, unsigned long n) { (void)d; (void)n; return 0; }' > "$probe.c"
          if ! clang -fsanitize=fuzzer,address,undefined -o "$probe" "$probe.c" 2>/dev/null; then
            tools/ci-apt.sh "libclang-rt-$(clang -dumpversion | cut -d. -f1)-dev"
            clang -fsanitize=fuzzer,address,undefined -o "$probe" "$probe.c"
          fi

      - name: Restore the fuzz corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            src/omci/fuzz/build/corpus
          key: omci-fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            omci-fuzz-corpus-

      - name: Fuzz omcid (4 minutes, both targets at once)
        run: make fuzz-omci FUZZ_SECONDS=240 FUZZ_JOBS=2

      # Only on main, and only after a clean run: a corpus is trimmed with
      # the build that just passed on it. Bounded, since it runs every
      # input once more.
      # A trim that runs out of time leaves the corpus as it was (the
      # trimmed set replaces it only on success), so main does not go red
      # for it and the untrimmed corpus is saved instead.
      - name: Trim the corpus to what adds coverage
        if: ${{ github.ref == 'refs/heads/main' }}
        continue-on-error: true
        run: timeout 600 make -s -C src/omci/fuzz minimize

      - name: Save the fuzz corpus
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            src/omci/fuzz/build/corpus
          key: omci-fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}

  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: diag, including the exporter contract under qemu
        run: make test-diag

  # The OMCI daemon under qemu-user, one job per suite (src/omci/*-test.sh,
  # `make test-omci-<suite>`); `make test-omci` runs them all in one go.
  # Each job builds only omcli and omcid.
  omci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [qemu, drv, resume, events, swdl, vlan, reload, live, keys, tables, getall, alarms, writes, mcast, pm, enc, voip, frames, check]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build omcli and omcid
        run: make test-omci-build

      - name: "OMCI daemon under qemu: ${{ matrix.suite }}"
        run: make test-omci-${{ matrix.suite }}

  # The unit tests of omcid's class 171 decode (src/omci/respond) and of igmpd
  # (src/igmp/test), under qemu-user in the diag toolchain container. They
  # were in no job before; `make test` runs them as legs too.
  mips-units:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: [test-omci-respond, test-igmp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Unit tests: ${{ matrix.target }}"
        run: make ${{ matrix.target }}

  clean-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Upstream tarballs (busybox, dropbear, iproute2, the Linux tree and its
      # signature) and the confd/metricsd release assets land in dl/. The key
      # is the files that pin their versions and SHA-256s, so a bump misses the
      # cache and fetches anew. A hit only skips the download: every fetch
      # script still re-checks the pinned SHA-256 of the file it finds there.
      - name: Cache pinned downloads (dl/)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            dl
          key: dl-clean-build-${{ runner.os }}-${{ hashFiles('packages/fetch.sh', 'packages/*/build.sh', 'kernel/618/fetch.sh', 'src/fetch-releases.sh', 'src/release-sha256.txt') }}

      # Fetches the pinned linux-6.18.x fresh (VERSION in kernel/618/fetch.sh) and re-checks its
      # pinned SHA-256 and the upstream GPG signature, against the signing
      # key pinned in that script (no keyserver is asked); packs it into
      # build/kernel-618/tree.tar. Does not compile it -- that is the ~hour
      # this job is not paying.
      - name: "Kernel tree: fetch and verify the pin"
        run: make kernel-tree

      - name: Our binaries (freestanding, in the freestanding toolchain image)
        run: make src

      # `make releases` is skipped here; image/build.sh already refuses to
      # assemble a partial image (ALLOW_PARTIAL=1 overrides that,
      # deliberately not set), so `make image` on this tree -- kernel and
      # packages never built -- must fail, and must say what it is missing
      # rather than fail silently or on an unrelated error.
      - name: make image on a partial tree fails closed, naming what is missing
        run: |
          if make image > image.log 2>&1; then
            echo "make image: expected failure (kernel/packages/releases not built here), but it exited 0" >&2
            cat image.log
            exit 1
          fi
          cat image.log
          grep -q "missing inputs" image.log || {
            echo "make image: failed as expected, but did not name the missing inputs" >&2
            exit 1
          }

  test-qemu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Upstream tarballs (busybox, dropbear, iproute2, the Linux tree and its
      # signature) and the confd/metricsd release assets land in dl/. The key
      # is the files that pin their versions and SHA-256s, so a bump misses the
      # cache and fetches anew. A hit only skips the download: every fetch
      # script still re-checks the pinned SHA-256 of the file it finds there.
      - name: Cache pinned downloads (dl/)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            dl
          key: dl-test-qemu-${{ runner.os }}-${{ hashFiles('packages/fetch.sh', 'packages/*/build.sh', 'kernel/618/fetch.sh', 'src/fetch-releases.sh', 'src/release-sha256.txt') }}

      - name: qemu-system-mips
        run: tools/ci-apt.sh qemu-system-mips

      # Everything test-qemu boots except the kernel (a stock, prebuilt
      # image, toolchain/images.env): busybox, dropbear/ip, our own
      # freestanding tools, and confd/metricsd from their own releases.
      - name: busybox, packages, src, releases
        run: |
          make busybox
          make packages
          make src
          make releases

      - name: Boot the real rootfs under qemu-system-mips and check it
        run: make test-qemu

      # rcS's action trace against its goldens (test/fixtures/rcs-trace-*):
      # needs the busybox built above and docker with ptrace, both here. It
      # was in no job, and the goldens had gone stale without anything saying so.
      - name: rcS action trace against its goldens
        run: make test-rcs

  full:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [lint, host, host-asan, diag, omci, mips-units]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Our binaries (freestanding, in the freestanding toolchain image)
        run: make src

  # Builds the full flashable image twice, in two separate checkouts, and
  # diffs the two tarballs member by member (tools/compare-images.sh):
  # proof that the release build depends on the sources and the pinned
  # toolchain/kernel/package versions, and on nothing else -- wall-clock
  # time and build-host identity included. The two tarballs must match to
  # the byte; nothing is set aside (docs/BUILDING.md, "Reproducible builds").
  #
  # Tags and workflow_dispatch only, not pull_request: this is `image-all`
  # run twice, about 25 minutes native each per the top-level Makefile
  # estimate, and a runner is slower than that. Twice that on every PR push
  # would make the queue the bottleneck for everything else in this file.
  # On a release tag these are the only image builds: release.yml publishes
  # the tarball compared here (keep-image) instead of building a third one.
  reproducible:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      image-sha256: ${{ steps.compare.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: build-a

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: build-b

      # Upstream tarballs (busybox, dropbear, iproute2, the Linux tree and its
      # signature) and the confd/metricsd release assets land in dl/. The key
      # is the files that pin their versions and SHA-256s, so a bump misses the
      # cache and fetches anew. A hit only skips the download: every fetch
      # script still re-checks the pinned SHA-256 of the file it finds there.
      - name: Cache pinned downloads (dl/)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build-a/dl
            build-b/dl
          key: dl-reproducible-${{ runner.os }}-${{ hashFiles('build-a/packages/fetch.sh', 'build-a/packages/*/build.sh', 'build-a/kernel/618/fetch.sh', 'build-a/src/fetch-releases.sh', 'build-a/src/release-sha256.txt') }}

      - name: Version for this comparison
        run: echo "VERSION=${GITHUB_REF_NAME:-repro-dispatch}" >> "$GITHUB_ENV"

      - name: squashfs-tools (unsquashfs, for the comparison step)
        run: build-a/tools/ci-apt.sh squashfs-tools

      # Distinct VOL names: the docker build cache kernel/build.sh uses is a
      # named volume (odi-kbuild-618 by default), and both steps share the
      # same docker daemon on this runner. Without this, Build B would reuse
      # the incremental cache Build A left behind, and the two builds never
      # being truly independent would go unnoticed -- the same failure mode
      # this job exists to catch, just hidden instead of shown.
      - name: Build A
        working-directory: build-a
        run: VERSION="$VERSION" ROOT_PW=locked VOL=odi-kbuild-618-a make image-all

      - name: Build B
        working-directory: build-b
        run: VERSION="$VERSION" ROOT_PW=locked VOL=odi-kbuild-618-b make image-all

      - name: Compare the two tarballs
        id: compare
        run: |
          build-a/tools/compare-images.sh \
            "build-a/out/image/$VERSION.tar" "build-b/out/image/$VERSION.tar"
          echo "sha256=$(sha256sum "build-a/out/image/$VERSION.tar" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Before anything leaves this job: a ROOT_PW=locked build writes no
      # password file, and none may reach the artifact below, which anyone
      # with read access to the run can download before the release is
      # approved.
      - name: No password file next to the compared image
        if: inputs.keep-image
        run: |
          if ls build-a/out/image/root-password*.txt >/dev/null 2>&1; then
            echo "ci.yml: a root-password file exists for a ROOT_PW=locked build -- refusing to keep the image" >&2
            exit 1
          fi

      # For release.yml only (keep-image): the compared tarball and the build
      # output of A that tools/generate-sbom.sh hashes into the SBOM's file
      # components (the binaries, the confd assets, the packages, the replay
      # tables). The release job checks the tarball against image-sha256
      # above before it uses any of it, takes the kernel for the SBOM from
      # that tarball, and checks the file components against its rootfs.
      # 30 days: the longest a deployment can wait for its approval. Every
      # path is under build-a/out/: the artifact is rooted there, and the
      # release job unpacks it into out/.
      - name: Keep the compared image for the release job
        if: inputs.keep-image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image
          if-no-files-found: error
          retention-days: 30
          overwrite: true
          path: |
            build-a/out/image/${{ env.VERSION }}.tar
            build-a/out/kernel-sources.txt
            build-a/out/bin/
            build-a/out/confd-assets/
            build-a/out/firmware/odi/
            build-a/out/busybox
            build-a/out/dropbearmulti
            build-a/out/ip
